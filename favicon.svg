  <!-- The Romieaux mark: the serif R the progress screen already draws, in
       the sand gold #b08a50 on the ink brown #2e1e0e. Authored as a PATH and
       not as a text element, because an SVG favicon cannot fetch Playfair
       Display: a text mark would render in whatever serif the viewer has.
       (No CSS variable names appear above. An XML comment may not contain a
       double hyphen, and every Romieaux custom property starts with one.) -->
